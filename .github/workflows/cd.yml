# ③ CD with AI risk gate: build Flutter web -> AI + rules score the change ->
#    low/medium: auto deploy to GitHub Pages | high: wait for human approval
#    -> smoke test after deploy.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Ensure web platform exists
        run: "[ -d web ] || flutter create . --platforms=web --project-name ai_cicd_demo"

      - name: Build
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  risk:
    name: AI risk gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
    outputs:
      level: ${{ steps.risk.outputs.level }}
      score: ${{ steps.risk.outputs.score }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: risk
        name: Score deploy risk
        run: python3 .github/scripts/risk.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          AI_MODEL: ${{ vars.AI_MODEL }}

  approve:
    name: Human approval (risk HIGH)
    needs: risk
    if: needs.risk.outputs.level == 'high'
    runs-on: ubuntu-latest
    # Settings > Environments > production-approval > Required reviewers
    environment: production-approval
    steps:
      - run: echo "Approved by a human for risk score ${{ needs.risk.outputs.score }}"

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, risk, approve]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.risk.result == 'success' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Post-deploy smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the site is up
        run: |
          url="${{ needs.deploy.outputs.url }}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url" | grep -qi "flutter"; then
              echo "## ✅ Smoke test passed: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Not ready yet ($i), retrying..."; sleep 10
          done
          echo "## ❌ Smoke test failed: $url → cân nhắc rollback" >> "$GITHUB_STEP_SUMMARY"
          exit 1
