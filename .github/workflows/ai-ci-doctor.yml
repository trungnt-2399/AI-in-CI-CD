# ② AI CI Doctor: when "CI" fails, read the failed logs + PR diff,
#    explain the root cause and suggest a fix as a PR comment.
#    Note: workflow_run only uses the version of this file on the default branch.
name: AI CI Doctor

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
  models: read

jobs:
  diagnose:
    name: Diagnose failure
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask AI why CI failed
        run: python3 .github/scripts/ci_doctor.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          AI_MODEL: ${{ vars.AI_MODEL }}

  resolved:
    name: Mark resolved
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: python3 .github/scripts/ci_doctor.py --resolved
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
